# SearXNG config for the GemiX web stack: images for search_image, and the
# general category that the agent-search sidecar queries for search_web.
# use_default_settings keeps the full engine catalog; we only override what we
# need. The general engines (DuckDuckGo, Brave, Bing, Wikipedia, ...) come from
# that catalog already active — the block at the bottom only adds the image
# engines, which the defaults leave off.

use_default_settings: true

general:
  instance_name: "GemiX Web Stack"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  # JSON is required by both GemiX (image search) and the agent-search sidecar.
  # Keep html for manual browser checks.
  formats:
    - html
    - json

server:
  # Overwritten by container env where set; port inside the container is 8080.
  limiter: false
  public_instance: false
  image_proxy: false
  # MUST be changed on the server (docker-compose header shows openssl one-liner).
  secret_key: "CHANGE_ME_TO_A_LONG_RANDOM_STRING"
  method: "GET"

ui:
  static_use_hash: true

# Activate broad image engines (defaults often leave Google Images inactive).
engines:
  - name: google images
    engine: google_images
    shortcut: goi
    inactive: false
    disabled: false
  - name: bing images
    engine: bing_images
    shortcut: bii
    inactive: false
    disabled: false
  - name: duckduckgo images
    engine: duckduckgo_extra
    categories: [images]
    ddg_category: images
    shortcut: ddi
    inactive: false
    disabled: false
