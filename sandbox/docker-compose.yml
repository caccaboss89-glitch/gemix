# GemiX sandbox - reference topology.
#
# This file is NOT used in production (src/sandbox/workspaceRuntime.js spawns
# containers programmatically). It exists to:
#   1. Let you verify the image + proxy work on your Linux server:
#        docker compose -f sandbox/docker-compose.yml up --build
#   2. Document the exact network topology / mounts / limits the manager
#      will reproduce at runtime.
#
# Production notes:
#   - The manager creates ONE sandbox container per active workspaceId
#     (group:<id> or user:<storageId>) and reuses it for the session.
#   - The proxy is a singleton: one instance shared by all sandboxes.
#   - Volumes are mounted per-container by the manager (not statically).

services:
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: gemix-sandbox-proxy:latest
    container_name: gemix-sandbox-proxy
    restart: unless-stopped
    # Opens every sandbox connection itself, from this container's own bridge
    # network. No allowlist, but only globally routable destinations: the home
    # LAN the host sits on is denied like any other private range.
    #
    # host.docker.internal is how the container reaches GemiX's notify endpoint
    # on the host; GEMIX_NOTIFY_BIND must name an address the host actually
    # listens on for that (see SERVER_SETUP.md).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PROXY_PORT: "8080"
      # Host notify URL, e.g. http://host.docker.internal:9999/notify
      GEMIX_NOTIFY_URL: "${GEMIX_NOTIFY_URL:-}"
      GEMIX_NOTIFY_SECRET: "${GEMIX_NOTIFY_SECRET:-}"
    networks:
      default: {}          # normal bridge: this container's route to the internet
      sandbox_net: {}      # reachable by sandboxes as hostname "gemix-sandbox-proxy"
    # Do NOT expose the port to the host. Production workspaces reach it from
    # a separate internal network created for each conversation by Node.
    mem_limit: 512m
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  sandbox_example:
    # Manual single-workspace example. Production does not use this shared
    # sandbox_net: Node creates one internal network per conversation.
    build:
      context: .
      dockerfile: Dockerfile
    image: gemix-sandbox:latest
    container_name: gemix-sandbox-example
    depends_on: [proxy]
    entrypoint: ""
    command: ["python", "/opt/sandbox/quota_guard.py", "/workspace=524288000"]
    user: "1000:1000"
    environment:
      HTTP_PROXY:  "http://gemix-sandbox-proxy:8080"
      HTTPS_PROXY: "http://gemix-sandbox-proxy:8080"
      http_proxy:  "http://gemix-sandbox-proxy:8080"
      https_proxy: "http://gemix-sandbox-proxy:8080"
      NO_PROXY:    "localhost,127.0.0.1"
    networks:
      sandbox_net: {}      # no default internet; only the proxy is reachable
    read_only: false       # /workspace must be writable
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    # Mount a real pair here in tests, as the manager does per conversation:
    # volumes:
    #   - /path/to/workspace:/workspace:rw
    #   - /path/to/attachments:/attachments:ro

networks:
  # Internal-only network where sandboxes live; no direct internet.
  sandbox_net:
    driver: bridge
    internal: true
